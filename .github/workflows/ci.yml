name: CI

on:
  push:
    branches: [master, develop, 'codex/**']
    tags: ['v*']
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.workspace }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workspace: [crates/tiderm-core, crates/tiderm-textdoc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install core system dependencies
        if: matrix.workspace == 'crates/tiderm-core'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libudev-dev libssl-dev
      - uses: ./.github/actions/setup-rust
        with:
          workspaces: ${{ matrix.workspace }}
      - name: Format
        working-directory: ${{ matrix.workspace }}
        run: cargo fmt --check
      - name: Clippy
        working-directory: ${{ matrix.workspace }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        working-directory: ${{ matrix.workspace }}
        run: cargo test --locked
      - name: Core-only feature build
        if: matrix.workspace == 'crates/tiderm-textdoc'
        working-directory: crates/tiderm-textdoc
        run: cargo check --locked --all-targets --no-default-features --features core

  terminal:
    name: Terminal engine (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          workspaces: |
            crates/tiderm-terminal
            tools/logstore-probe
      - name: Format
        working-directory: crates/tiderm-terminal
        run: cargo fmt --package tiderm-terminal --check
      - name: Clippy
        working-directory: crates/tiderm-terminal
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        working-directory: crates/tiderm-terminal
        run: cargo test --locked
      - name: Logstore probe format
        working-directory: tools/logstore-probe
        run: cargo fmt --package logstore-probe --check
      - name: Logstore probe Clippy
        working-directory: tools/logstore-probe
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Logstore probe tests
        working-directory: tools/logstore-probe
        run: cargo test --locked
      - name: Terminal downstream consumer (no Cargo patches)
        run: cargo run --manifest-path tools/terminal-consumer/Cargo.toml --locked

  native:
    name: Native Qt (Windows)
    runs-on: windows-2025
    # Static OpenSSL has separate cold builds for check/test/core artifacts.
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-native
      - name: Format
        working-directory: native
        run: cargo fmt --package native -- --check
      - name: C++ warning gate (forced Debug build)
        run: ./native/scripts/check-cpp-warnings.ps1 -Configuration debug
      - name: Translation coverage
        run: ./native/scripts/check-i18n-coverage.ps1
      - name: Clippy
        working-directory: native
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        timeout-minutes: 20
        working-directory: native
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: cargo test --locked --bin native
      - name: SSH private-key compatibility (isolated Windows fixture)
        timeout-minutes: 20
        run: |
          python -m pip install paramiko==5.0.0 cryptography==48.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path crates/tiderm-core/Cargo.toml --locked --test ssh_key_matrix -- --ignored --nocapture
      - name: Local shell Ctrl+C semantics
        run: cargo test --manifest-path crates/tiderm-core/Cargo.toml --locked --test pty_interrupt -- --ignored --nocapture
      - name: All configured Qt self-tests (Chinese and English)
        timeout-minutes: 20
        working-directory: ${{ runner.temp }}
        run: |
          New-Item -ItemType Directory -Force -Path native/target | Out-Null
          foreach ($locale in @('en_US', 'zh_CN')) {
            $env:TIDETERM_LANG = $locale
            & pwsh -NoProfile -File "$env:GITHUB_WORKSPACE/native/scripts/run-selftests.ps1" -LogDirectory "$env:GITHUB_WORKSPACE/native/target/selftests/$locale"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload Qt diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qt-ci-diagnostics-${{ github.run_id }}
          path: |
            native/target/diagnostics/**/*.log
            native/target/selftests/**
            ${{ runner.temp }}/native/target/*.png
          if-no-files-found: warn
          retention-days: 14

  security-audit:
    name: Dependency Audit (Rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          workspaces: |
            crates/tiderm-core
            crates/tiderm-textdoc
            native
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit all lockfiles
        run: |
          mkdir -p audit-reports
          failed=0
          for workspace in crates/tiderm-core crates/tiderm-textdoc native; do
            name=$(basename "$workspace")
            cargo audit --file "$workspace/Cargo.lock" --deny warnings --json > "audit-reports/$name.json" || failed=1
          done
          exit "$failed"
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-${{ github.run_id }}
          path: audit-reports/*.json
          if-no-files-found: warn
          retention-days: 14

  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate release manifests
        run: |
          python - <<'PY'
          import re, tomllib
          from pathlib import Path
          for path in ('native/Cargo.toml', 'crates/tiderm-core/Cargo.toml', 'crates/tiderm-textdoc/Cargo.toml', 'crates/tiderm-terminal/Cargo.toml'):
              package = tomllib.loads(Path(path).read_text())['package']
              version = package['version']
              assert re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', version), (path, version)
              print(f'{path}: {version}')
          PY
      - name: File size gate
        run: bash scripts/check-file-size.sh
      - name: Lint GitHub workflows
        run: |
          url=https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl --fail --location --retry 3 "$url" -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
