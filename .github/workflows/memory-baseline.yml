name: Windows Memory Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: Release Qt memory sample
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-native
      - name: Build release executable
        working-directory: native
        run: cargo build --locked --release --bin native
      - name: Measure main process at 1, 3 and 6 seconds
        run: |
          $ErrorActionPreference = 'Stop'
          $samples = @(./native/scripts/measure-startup.ps1 -ArgumentList '--window')
          if ($samples.Count -ne 3) { throw "Expected 3 samples, got $($samples.Count)" }
          $samples | Format-Table -AutoSize
          $samples | ConvertTo-Json -Depth 3 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/memory-samples.json"
          "commit=$env:GITHUB_SHA`nqt=6.12.0`nrust=$(rustc --version)" | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/build-info.txt"
      - name: Upload measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-memory-samples
          path: |
            ${{ runner.temp }}/memory-samples.json
            ${{ runner.temp }}/build-info.txt
          if-no-files-found: error
          retention-days: 30
