name: Repository Rust toolchain
description: Install the version in rust-toolchain.toml and cache a standalone workspace
inputs:
  workspaces:
    description: Cargo workspace paths (one per line)
    required: true
  cache-key:
    description: Additional cache key for native SDK compatibility
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
    - name: Read repository toolchain
      id: toolchain
      shell: bash
      run: |
        python - <<'PY'
        import os, tomllib
        from pathlib import Path
        channel = tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel']
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f'channel={channel}\n')
        PY
    - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-05
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: ${{ inputs.workspaces }}
        key: ${{ inputs.cache-key }}
        cache-on-failure: true
